# Static hosting for a site that exists to be indexed and sits behind a
# Cloudflare tunnel. Two things follow from that:
#
#   * Caching is the origin's job to *describe*, not to do. Cloudflare holds the
#     edge copy; these headers are what tell it how long for. Getting them wrong
#     is the difference between one origin hit per ten minutes and one per
#     visitor, on a box that is also serving the API.
#
#   * There is no TLS here and no real-IP handling. The tunnel terminates TLS
#     and this listens only on the loopback address the tunnel dials.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro is configured with `trailingSlash: 'always'`, so every page is
    # `<path>/index.html`. Anything that misses falls through to Starlight's 404
    # rather than nginx's, which is the one that carries the language links.
    #
    # `=404` and not `/404.html` as the last argument: a file path there is
    # served with status 200, so every mistyped URL would have answered "OK"
    # while showing a not-found page. Search engines index those. Measured, not
    # guessed - the first version of this file did exactly that.
    location / {
        try_files $uri $uri/ =404;

        # The browser revalidates every time; the edge holds it for ten minutes.
        # A documentation site can be ten minutes stale. It cannot afford to
        # send every reader to a single droplet.
        add_header Cache-Control "public, max-age=0, s-maxage=600, must-revalidate" always;
    }

    # Filenames here carry a content hash, so a changed file is a changed name
    # and the old one can be cached until the heat death of the universe.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The search index. Same reasoning as above minus the hashing, so a day.
    location /pagefind/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Files whose whole purpose is to be fetched by a crawler or a model.
    # `charset=utf-8` is not optional: llms.txt carries Chinese.
    location ~ ^/(robots\.txt|llms\.txt|llms-full\.txt)$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
    }

    # nginx's own mime map already answers text/xml here, which is what a
    # sitemap is allowed to be; only the caching needs saying.
    location ~ ^/sitemap.*\.xml$ {
        add_header Cache-Control "public, max-age=0, s-maxage=3600, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        # Never cache a not-found: the page it stood in for may exist tomorrow.
        add_header Cache-Control "no-store" always;
    }

    # Nothing here is user-generated and nothing is embedded elsewhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Cloudflare logs the requests that matter and this box has a small disk.
    access_log off;
}
