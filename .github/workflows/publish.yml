# Build the site and publish it as an image.
#
# The server pulls; it never builds. That is the same rule the API stack follows
# and for the same reason - the host has two cores and shares its memory with a
# headless Chromium, so an `npm ci` there is a way to OOM PostgreSQL.
#
# GHCR rather than Docker Hub: it needs no secret beyond the token every
# workflow already has, and this image is infrastructure rather than something
# anybody is meant to go looking for.
name: Publish site image

on:
  push:
    branches: [main]
  # The documentation lives upstream and changes on its own schedule. Without
  # this the submodule pointer sits wherever it was last committed and the site
  # quietly serves an older copy of pages that have already moved on.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Spelled out in lowercase rather than derived from `github.repository_owner`,
  # which is `Evil0ctal` here. docker/metadata-action lowercases it on the way
  # into a tag, so the push worked and only the smoke test below - which used
  # the raw value - died on `repository name must be lowercase`.
  IMAGE: ghcr.io/evil0ctal/douyin-wtf

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `write` so the scheduled run can commit the submodule bump. A push made
      # with GITHUB_TOKEN does not start another workflow, which is what keeps
      # this from triggering itself in a loop - and is why the bump and the
      # build have to be the same run rather than two.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Without this `vendor/upstream` is an empty directory and the build
          # fails in sync-docs.mjs - loudly, which is the point. A site that
          # published with no documentation in it would be worse.
          submodules: recursive

      - name: Follow the upstream documentation
        # Only on a schedule or a manual run. A push already says which commit
        # the author meant, and moving the pointer under them would make the
        # published site something nobody asked for.
        if: github.event_name != 'push'
        run: |
          before=$(git -C vendor/upstream rev-parse HEAD)
          git submodule update --remote --recursive vendor/upstream
          after=$(git -C vendor/upstream rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo "upstream unchanged at ${before:0:7}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "upstream ${before:0:7} -> ${after:0:7}" >> "$GITHUB_STEP_SUMMARY"
          git -C vendor/upstream log --oneline "$before..$after" -- documents \
            >> "$GITHUB_STEP_SUMMARY" || true

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add vendor/upstream
          git commit -m "chore: follow upstream documentation to ${after:0:7}"
          git push

      - name: Check the documentation submodule actually arrived
        run: |
          count=$(ls vendor/upstream/documents/en/*.md 2>/dev/null | wc -l)
          echo "English documentation pages: $count"
          echo "Upstream commit: $(git -C vendor/upstream rev-parse --short HEAD)"
          [ "$count" -gt 0 ] || { echo "submodule is empty" >&2; exit 1; }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # `latest` is what the server tracks; `sha-` is what to pin to when a
          # deploy needs to be reproducible or rolled back.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only: this image is pulled by exactly one machine and that
          # machine is amd64. Building arm64 under emulation would double the
          # workflow time for nobody.
          platforms: linux/amd64

      - name: Check the built image serves what it should
        run: |
          # The sha tag, not a digest: `digest` is an output of
          # build-push-action, and asking the metadata step for one yields an
          # empty string and a reference ending in a bare `@`.
          docker run -d --name probe -p 8099:80 "${IMAGE}:sha-${{ github.sha }}"
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8099/robots.txt && break
            sleep 1
          done
          set -e
          curl -fsS http://127.0.0.1:8099/robots.txt | grep -q "Sitemap:"
          curl -fsS http://127.0.0.1:8099/llms.txt | head -1 | grep -q "Douyin_TikTok_Download_API"
          curl -fsS http://127.0.0.1:8099/ | grep -q 'hreflang="zh-CN"'
          curl -fsS http://127.0.0.1:8099/zh/api/ | grep -q "本页内容"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/nope/)" = "404"
          docker rm -f probe
          echo "image serves the site"
